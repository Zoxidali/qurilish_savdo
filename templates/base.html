<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Qurilish Savdo{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Qurilish Savdo</a>
        <div class="ms-auto d-flex gap-2">
            <a class="btn btn-outline-light btn-sm" href="/cart/">Savat</a>
            <a class="btn btn-outline-light btn-sm" href="/dashboard/">Dashboard</a>
            {% if request.user.is_authenticated %}
                <span class="text-white align-self-center">{{ request.user.username }}</span>
                <a class="btn btn-warning btn-sm" href="/logout/">Logout</a>
            {% else %}
                <a class="btn btn-light btn-sm" href="/login/">Login</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container py-4">
    {% block content %}{% endblock %}
</div>
</body>
</html>
